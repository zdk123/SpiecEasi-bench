name: slr-bench

on:
  workflow_dispatch:
    inputs:
      repo:
        description: GitHub repo to install SpiecEasi from (owner/name)
        default: zdk123/SpiecEasi
      ref:
        description: SpiecEasi git ref to benchmark
        default: perf/slr-admm
      max_p:
        description: Largest p in the grid
        default: '300'

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-reference, os: ubuntu-latest,  blas: reference }
          - { name: ubuntu-openblas,  os: ubuntu-latest,  blas: openblas }
          - { name: ubuntu-mkl,       os: ubuntu-latest,  blas: mkl }
          - { name: macos-accelerate, os: macos-latest,   blas: accelerate }
          - { name: windows-reference, os: windows-latest, blas: reference }
    env:
      BENCH_RUNNER: ${{ matrix.name }}
      BENCH_THREADS: '1'
      SPIECEASI_REPO: ${{ github.event.inputs.repo }}
      SPIECEASI_REF: ${{ github.event.inputs.ref }}
      MAX_P: ${{ github.event.inputs.max_p }}
      BENCH_SPIECEASI_REF: ${{ github.event.inputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Select BLAS/LAPACK (Linux)
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.blas }}" in
            openblas)
              sudo apt-get update && sudo apt-get install -y libopenblas0-pthread
              sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3
              sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3 ;;
            mkl)
              sudo apt-get update && sudo apt-get install -y intel-mkl
              sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/libmkl_rt.so
              sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/libmkl_rt.so ;;
            *) echo "reference BLAS/LAPACK" ;;
          esac

      - name: Select BLAS/LAPACK (macOS Accelerate)
        if: matrix.blas == 'accelerate'
        run: |
          RLIB=$(Rscript -e 'cat(R.home("lib"))')
          ln -sf /System/Library/Frameworks/Accelerate.framework/Frameworks/vecLib.framework/Versions/Current/libBLAS.dylib "$RLIB/libRblas.dylib"
          ln -sf "$RLIB/libRlapack.vecLib.dylib" "$RLIB/libRlapack.dylib" 2>/dev/null || true

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "BiocManager", "bench", "RhpcBLASctl"))
          remotes::install_github("zdk123/pulsar", upgrade = "never")  # archived on CRAN 2026-08-22
          BiocManager::install("phyloseq", update = FALSE, ask = FALSE)
          remotes::install_github(Sys.getenv("SPIECEASI_REPO"), ref = Sys.getenv("SPIECEASI_REF"), upgrade = "never")
        shell: Rscript {0}

      - name: Record system
        run: |
          print(sessionInfo()); print(La_library()); print(extSoftVersion())
        shell: Rscript {0}

      - name: Kernel microbenchmarks
        run: Rscript R/kernels.R "results/kernels-${{ matrix.name }}.csv"

      - name: Grid ablation
        run: Rscript R/run_grid.R "$MAX_P" 3 "results/grid-${{ matrix.name }}.csv"
        shell: bash

      - name: Time to fixed accuracy
        run: Rscript R/accuracy_grid.R "$MAX_P" 1e-6 "results/accuracy-${{ matrix.name }}.csv"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          path: results/

  compare:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Rank-order comparison across systems
        run: Rscript R/compare_systems.R results
      - uses: actions/upload-artifact@v4
        with:
          name: comparison
          path: results/comparison*
